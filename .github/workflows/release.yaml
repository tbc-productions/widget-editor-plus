name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version
          node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Node.js 24 is required')"

      - name: Install Dependencies
        run: npm ci

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Build and Pack
        run: |
          npm run build
          npm run pack

      - name: Install GitHub CLI
        if: github.server_url == 'https://github.com'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -e

          # Checkout may replace an annotated tag with the event commit ID.
          git fetch --force --no-tags origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"

          RELEASE_NOTES_FILE="$(mktemp)"
          export RELEASE_NOTES_FILE
          trap 'rm -f "$RELEASE_NOTES_FILE"' EXIT
          node -e '
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const ref = `refs/tags/${process.env.TAG_NAME}`;
          const type = execFileSync("git", ["cat-file", "-t", ref], { encoding: "utf8" }).trim();
          if (type !== "tag") throw new Error("Release notes require an annotated tag");
          const annotation = execFileSync("git", ["cat-file", "tag", ref], { encoding: "utf8" });
          const notes = annotation.slice(annotation.indexOf("\n\n") + 2);
          if (!notes.trim()) throw new Error("The release tag has no release notes");
          fs.writeFileSync(process.env.RELEASE_NOTES_FILE, notes);
          '

          # Detect platform without using non-standard YAML context objects
          if [ "$SERVER_URL" != "https://github.com" ] || [ -n "$GITEA_SERVER_URL" ]; then
            IS_GITEA=true
            API_URL="${GITEA_SERVER_URL:-${SERVER_URL}}/api/v1"
          else
            IS_GITEA=false
            API_URL="${GITHUB_API_URL:-https://api.github.com}"
          fi

          echo "Publishing release for ${TAG_NAME} on ${REPO} (Is Gitea: ${IS_GITEA}, API: ${API_URL})..."

          if [ "$IS_GITEA" = true ]; then
            export API_URL TOKEN REPO TAG_NAME
            node -e '
            const fs = require("fs");
            const path = require("path");

            const token = process.env.TOKEN;
            const apiUrl = process.env.API_URL;
            const repo = process.env.REPO;
            const tag = process.env.TAG_NAME;
            const releaseBody = fs.readFileSync(process.env.RELEASE_NOTES_FILE, "utf8");

            async function run() {
              let releaseId;
              const tagRes = await fetch(`${apiUrl}/repos/${repo}/releases/tags/${tag}`, {
                headers: { "Authorization": `token ${token}` }
              });

              if (tagRes.ok) {
                const existing = await tagRes.json();
                releaseId = existing.id;
                console.log(`Found existing release with ID: ${releaseId}`);
                const updateRes = await fetch(`${apiUrl}/repos/${repo}/releases/${releaseId}`, {
                  method: "PATCH",
                  headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({ body: releaseBody })
                });
                if (!updateRes.ok) throw new Error(`Failed to update release notes: ${updateRes.status}`);
              } else {
                if (tagRes.status !== 404) throw new Error(`Failed to find release: ${tagRes.status}`);
                console.log("Creating new release...");
                const createRes = await fetch(`${apiUrl}/repos/${repo}/releases`, {
                  method: "POST",
                  headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    tag_name: tag,
                    name: tag,
                    body: releaseBody,
                    draft: false,
                    prerelease: false
                  })
                });
                if (!createRes.ok) {
                  const errText = await createRes.text();
                  throw new Error(`Failed to create release: ${createRes.status} ${errText}`);
                }
                const created = await createRes.json();
                releaseId = created.id;
                console.log(`Created release with ID: ${releaseId}`);
              }

              const assetsRes = await fetch(`${apiUrl}/repos/${repo}/releases/${releaseId}/assets`, {
                headers: { "Authorization": `token ${token}` }
              });
              const existingAssets = assetsRes.ok ? await assetsRes.json() : [];

              const targetDir = path.join(process.cwd(), "target");
              const files = fs.readdirSync(targetDir);

              for (const fileName of files) {
                const filePath = path.join(targetDir, fileName);
                if (!fs.statSync(filePath).isFile()) continue;

                const existingAsset = Array.isArray(existingAssets) ? existingAssets.find(a => a.name === fileName) : null;
                if (existingAsset) {
                  console.log(`Deleting existing asset ${fileName} (ID: ${existingAsset.id}) before overwrite...`);
                  await fetch(`${apiUrl}/repos/${repo}/releases/${releaseId}/assets/${existingAsset.id}`, {
                    method: "DELETE",
                    headers: { "Authorization": `token ${token}` }
                  });
                }

                console.log(`Uploading asset ${fileName}...`);
                const fileBuffer = fs.readFileSync(filePath);
                const formData = new FormData();
                const blob = new Blob([fileBuffer], { type: "application/octet-stream" });
                formData.append("attachment", blob, fileName);

                const uploadRes = await fetch(`${apiUrl}/repos/${repo}/releases/${releaseId}/assets?name=${encodeURIComponent(fileName)}`, {
                  method: "POST",
                  headers: { "Authorization": `token ${token}` },
                  body: formData
                });

                if (!uploadRes.ok) {
                  const uploadErr = await uploadRes.text();
                  throw new Error(`Failed to upload ${fileName}: ${uploadRes.status} ${uploadErr}`);
                }
                console.log(`Successfully uploaded ${fileName}`);
              }

              console.log(`Release ${tag} assets processed successfully!`);
            }

            run().catch(err => {
              console.error(err);
              process.exit(1);
            });
            '
          else
            echo "Publishing release via GitHub CLI..."
            if gh release view "${TAG_NAME}" --repo "${REPO}" >/dev/null 2>&1; then
              echo "Updating existing GitHub release assets..."
              gh release edit "${TAG_NAME}" --repo "${REPO}" --notes-file "$RELEASE_NOTES_FILE"
              gh release upload "${TAG_NAME}" target/* --repo "${REPO}" --clobber
            else
              echo "Creating new GitHub release..."
              gh release create "${TAG_NAME}" target/* --repo "${REPO}" --title "${TAG_NAME}" --verify-tag --notes-file "$RELEASE_NOTES_FILE"
            fi
          fi

          echo "Release ${TAG_NAME} published successfully!"
